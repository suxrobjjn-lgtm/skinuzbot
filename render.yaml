services:
  - type: web
    name: skinuzbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python skenuz_server.py
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: skinuz-database
          property: connectionString

databases:
  - name: skinuz-database
    databaseName: skinuzdb
    user: skinuz
    plan: free
